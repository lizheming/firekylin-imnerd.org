<!DOCTYPE html>
<html>
<head>
    <title>Robot Game</title>
    <meta charset="utf-8" />
    <style>
    * {margin:0;padding:0;}
    html,body{width:100%;height:100%;}
    body {background-color: #d0d0d0}
    h1 {text-align:center;font-family: Impact;color: #ffffff;background-color: #000000}
    #mytable { margin:1em auto; border-collapse:collapse; } 
    #mytable td { cursor:pointer; width:30px; height:30px; border:1px solid #666; text-align: center; contenteditable: true;}
    #meta {width:100%;margin:0 auto;text-align:center;}
    .display {display:none;}
    td.player {background:skyblue;font-weight:bold;}
    td.robot {background:pink;font-weight:bold;}
    .mine {background:yellow;}
    .barrier {background:green;}
    </style>
</head>
<body>
<h1>Robot Game</h1>
<table id="mytable" align="center"></table> 
<div id="meta">
    <div id="score" class="display">
        <p class="player">Player's score:<span>0</span></p>
        <p class="robot">Robot's score:<span>0</span></p>
    </div>
    <!--<button onclick="setupToggle(this)">SETUP</button>-->
    <button onclick="playToggle(this)">PLAY</button>
    <button onclick="over()" disabled>END</button>
</div>
<script> 
var mytable = document.querySelector('#mytable'), number = 18; 
for (var i = 0; i < number; i++) { 
    var tr = mytable.insertRow(); 
    for (var j = 0; j < number; j++) { 
        var td = tr.insertCell();
        td.setAttribute('data-id', i*number+j);
        var margin = "";
        if(i==0) margin = "down";
        if(i==number-1) margin = "top";
        if(j==0) margin = "right";
        if(j==number-1) margin = "left";
        if(i==0&&j==0) margin = "rightDown";
        if(i==0&&j==number-1) margin = "leftDown";
        if(i==number-1&&j==0) margin = "rightTop";
        if(i==number-1&&j==number-1) margin = "leftTop";
        td.setAttribute('data-margin', margin);
    } 
}

/** 判断非1-9,o,u字符 **/
document.addEventListener('keydown', function(e) {
    /** 根据字符获取keyCode **/
    /** &|%|\|( 分别代表 上左右下 方向键 **/
    var validKey = [1,2,3,4,5,6,7,8,9,'O','U','&','%','\'','('].map(function(o){return String(o).charCodeAt()});
    /** 查找keyCode的索引 **/
    var n = validKey.indexOf(e.keyCode);
    /** 根据对应的索引进行相应的操作 **/
    if(n>10) {
        /** 移动 **/
        if(mytable.classList.contains('setup')) {
            e.preventDefault();
            e.target.innerHTMl = '';
            return false;
        } else move(['down','right','left','top'][n%10-1]);
    } else if(n==10) {
        /** 增加player **/
        if(mytable.querySelectorAll('.player').length != 0) {
            alert("Only one player!");
            return e.target.innerHTML = '';
        }
        e.target.classList.add('player');
        return true;       
    } else if(n==9) {
        /** o 增加障碍物 **/
        e.target.classList.add('barrier');
        return true;
    } else if(n<9 && n>=0) {
        /** 非以上索引则放置宝藏 **/
        e.target.classList.add('mine');
        e.target.setAttribute('value', n+1);     
    } else {
        /** 非1-9,o,u **/
        alert('You just can type 1-9,o,u');
        if(mytable.classList.contains('setup'))
            e.target.innerHTML = '';
        return false;
    }
});

function move(direction) {
    playerMove(direction);
    robotMove();
    isOver();
}

function playerMove(direction) {
    /** 获取Player所在的DOM的索引 **/
    var player = document.querySelector('.player'),
        seq = +player.getAttribute('data-id'),
        margin = player.getAttribute('data-margin') || "";

    /** 根据direction得到目标位置索引 **/
    switch(direction) {
        case 'left':
            if(margin.indexOf('left') == -1) seq+=1;
        break;
        case 'right':
            if(margin.indexOf('right') == -1) seq-=1;
        break;
        case 'top':
            if(margin.toLowerCase().indexOf('top') == -1) seq+=number;
        break;
        case 'down':
            if(margin.toLowerCase().indexOf('down') == -1) seq-=number;
        break;
    } 

    var tar = mytable.querySelector('td[data-id="'+seq+'"]');
    /** 未移动则直接退出 **/
    if(tar.classList.contains('player')) return false;
    /** 目标位置是barrier则跳出移动 **/
    if(tar.classList.contains('barrier')) return false;
    /** 目标位置是robot则跳出移动 **/
    if(tar.classList.contains('robot')) return false;

    /** 目标位置是mine则加分 **/
    if(tar.classList.contains('mine')) {
        var score = document.querySelector('#score .player span');
        score.innerHTML = +score.innerHTML+tar.getAttribute('value')/1;
        tar.classList.remove('mine');
        tar.removeAttribute('value');
    }
    /** 去除老位置player标志，在新位置增加player标志 **/
    player.classList.remove('player');
    player.innerHTML = '';
    tar.classList.add('player');
    tar.innerHTML = 'u';
}
function robotMove() {
    var tars = robotCanMove();
    if(!tars) return false;
    var robot = document.querySelector('.robot');
    var tar = tars[Math.floor(Math.random()*tars.length)];
    /** 有宝藏点则跳到宝藏点去执行吃分操作 **/
    if(tar.classList.contains('mine')) {
        var score = document.querySelector('#score .robot span');
        score.innerHTML = +score.innerHTML+tar.getAttribute('value')/1;
        tar.classList.remove('mine');
        tar.removeAttribute('value');
    }
    robot.classList.remove('robot');
    robot.innerHTML = '';
    tar.classList.add('robot');
    tar.innerHTML = 'r';
    return true;
}
function isOver() {
    /** 结束操作判断 **/
    var mines = document.querySelectorAll('td.mine');
    if(mines.length ==0 || (!robotCanMove() && !playerCanMove())) over();
}
function over() {
    /** 执行结束操作 **/
    var score = {
        player: +document.querySelector('#score .player span').innerHTML,
        robot: +document.querySelector('#score .robot span').innerHTML
    };
    var winner = "";
    winner = (score.player > score.robot ? "player" : "robot")+" win!";
    if(score.player == score.robot) winner = "A dead beat!";
    alert(winner);
    window.location.href = window.location.href;
}
function robotCanMove() {
    /** 侦测robot是否下一步可以移动 并返回可移动的点**/
    /** 获取robot位置索引 **/
    var robot = document.querySelector('.robot');
    var seq = +robot.getAttribute('data-id');

    /** 得到robot下一步所有可能会跳到的位置 **/
    /** these codes are dirty! **/
    var pos = {
        left: seq-1,
        right: seq+1,
        top: seq+number,
        down: seq-number,
        leftTop: seq+number+1,
        rightTop: seq+number-1,
        leftDown: seq-number+1,
        rightDown: seq-number-1
    };
    var margin = robot.getAttribute('margin') || '';
    var allMargin = ['left', 'top', 'right', 'down', 'leftDown', 'rightDown', 'leftTop', 'rightTop'];
    switch(margin) {
        case 'top':var keys = [0,2,3,4,5];break;
        case 'left':var keys = [2,1,3,7,5];break;
        case 'right':var keys = [0,1,3,6,7];break;
        case 'down':var keys = [0,2,1,6,7];break;
        case 'leftTop':var keys = [2,5,3];break;
        case 'rightTop':var keys = [0,4,3];break;
        case 'leftDown':var keys = [2,7,1];break;
        case 'rightDown':var keys = [0,6,1];break;
        default:var keys = [0,1,2,3,4,5,6,7];break;
    }
    /** 根据property name获取到所有可能位置的DOM并过滤分成有宝藏的点和什么也没有的点 **/
    var tars = keys.map(function(k){return document.querySelector('td[data-id="'+pos[allMargin[k]]+'"]')}).filter(function(o) {return o});
    var mines = tars.filter(function(o) {return o.classList.contains('mine')});
    var spaces = tars.filter(function(o) {return !(o.classList.contains('mine')||o.classList.contains('barrier')||o.classList.contains('player'))});
    if(mines.length == 0 && spaces.length == 0) return false;
    else if(mines.length > 0) return mines;
    else return spaces;
}
function playerCanMove() {
    /** 侦测player是否可以移动 **/
    var player = document.querySelector('.player');
    var seq = player.getAttribute('data-id');
    var margin = player.getAttribute('data-margin') || '';

    var pos = {
        left: seq+1,
        right: seq-1,
        top: seq+number,
        down: seq-number
    };
    ['left','right','top','down'].forEach(function(direction) {
        if(margin.toLowerCase.indexOf(direction))
            delete pos[direction];
    });
    /** 获取所有可能移动的点如果在边界上过滤掉边界点之后查看是否还有可以移动的点 **/
    return Object.keys(pos).map(function(k){
        return document.querySelector('td[data-id="'+pos[k]+'"]')
    }).filter(function(o) {
        return o && !o.classList.contains('barrier') && !o.classList.contains('robot')
    }).length > 0 ? true : false;
}
/** setup button **/
var setupToggle = function(that) {
    mytable.classList.toggle('setup');
    that.disabled = true;
    that.nextElementSibling.disabled = false;
}
/** set Player **/
var playToggle = function(that) {
    autoSetup();
    setRobot(); /** set robot **/
    document.querySelector('#score').classList.toggle('display');
    // mytable.classList.toggle('setup');
    that.disabled = true;
    that.nextElementSibling.disabled = false;
    // Array.prototype.slice.call(document.querySelectorAll('td[contenteditable]')).forEach(function(item){item.contentEditable = false});
    /** check are there mines! **/
    if(document.querySelectorAll('.mine').length == 0) {
        alert('A dead heat!');
        window.location.href = window.location.href;
    }
}
var setRobot = function() {
    var rest = Array.prototype.slice.call(document.querySelectorAll('td')).filter(function(o) {
        return !(o.classList.contains('mine')||o.classList.contains('barrier')||o.classList.contains('player'))
    });
    var pos = Math.floor(Math.random()*rest.length);
    rest[pos].classList.add('robot');
    rest[pos].innerHTML = 'r';
}

/** setup **/
mytable.addEventListener('click', function(e) {
    /** there are useless when you are not at setup time. **/
    if(!mytable.classList.contains('setup')) return false;
    e.target.contentEditable = true;
    e.target.focus();
})

/** AutoSetup **/
function autoSetup() {
    var totalItems = number * number, sequences = [];
    for(i=0;i<totalItems;i++) sequences.push(i);
    var mines = Math.floor(totalItems*0.2);
    var barriers = Math.floor(totalItems*0.3);
    function setItem(num, callback) {
        for(i=0;i<num;i++) {
            var seq = Math.floor(Math.random() * sequences.length);
            tar = document.querySelector('td[data-id="'+sequences[seq]+'"]');
            callback(tar);
            sequences.splice(seq,1);
        }
    }
    setItem(barriers, function(tar) {
        tar.classList.add('barrier');
        tar.innerHTML = 'o';
    })
    setItem(mines, function(tar) {
        var quatity = Math.floor(Math.random() * 30);
        tar.classList.add('mine');
        tar.setAttribute('value', quatity);
        tar.innerHTML = quatity;        
    })
    setItem(1, function(tar) {
        tar.classList.add('player');
        tar.innerHTML = 'u';
    })
}
</script> 
</body>
</html>
