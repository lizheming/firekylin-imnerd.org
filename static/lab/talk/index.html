<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8" />
	<title>HiTalk</title>
	<style type="text/css">
	body {
		font-size:12px;
	}
	/*输入窗口*/
	#f input {
		border: 1px solid #A3A3A3;
		width: 238px;
		line-height: 20px;
		font-size:12px;
		padding:5px;
	}
	/*聊天窗口*/
	#stream ul {
		margin:0;
		padding:0;
	}
	#stream li {
		list-style-type:none;
		margin:10px 0;
		width:250px;
	}
	#stream span:before {
		content:'';
		display:block;
		height:0;
		width:0;
		position:relative;
		top:-9px;
		border:5px solid #FFF;
		border-bottom-color:greenyellow;
	}
	#stream span {
		padding:0 10px 8px 10px;
		background-color:greenyellow;
		display:inline-block;
	}

	/*	-webkit-text-size-adjust:none;*/
	::-webkit-scrollbar-track-piece{background:#444;}
	::-webkit-scrollbar{width:8px;height:8px;}
	::-webkit-scrollbar-thumb{height:40px;border:0;background-color:#666;}
	::-webkit-scrollbar-thumb:hover{background-color:#888;}

	</style>
	<script type="text/javascript" src="http://lib.sinaapp.com/js/jquery/1.9.1/jquery-1.9.1.min.js"></script>
	<script type="text/javascript" src="function.js"></script>
	<script>
	if(!$.cookie('name'))	window.location.href="login.html";
	$.cookie('time', '0');
	$(function() {
		$('body').on('keyup', function(e){
			if(e.keyCode == 13) {
				send($('#text').val());
				$('#text').val('');
				$('#text').focus();
				/*
				if($('#text').is(':focus') && t) {
					$('<li><span><em>'+$.cookie('name')+': </em>'+t+'</span></li>').prependTo('#stream ul');
				}
				*/
			}
		});
		setInterval("get()", 500);
	});
	</script>
</head>
<body>
	<div id="f">
		<input id="text" name="text" placeholder="输入消息" autocomplete="off" value="" x-webkit-speech />
	</div>
	<div id="stream">
		<ul>
			<li>
				<span>
					<em>admin:</em>
					欢迎来到HiTalk聊天系统。HiTalk，让聊天High起来！
				</span>
			</li>
		</ul>
	</div>
</body>
</html>
