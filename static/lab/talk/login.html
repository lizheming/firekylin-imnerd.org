<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8" />
	<title>HiTalk</title>
	<style type="text/css">
	body {
		font-size:12px;
	}
	/*输入窗口*/
	#f input {
		border: 1px solid #A3A3A3;
		width: 238px;
		line-height: 20px;
		font-size:12px;
		padding:5px;
	}
	/*聊天窗口*/
	#stream ul {
		margin:0;
		padding:0;
	}
	#stream li {
		list-style-type:none;
		margin:10px 0;
		width:250px;
	}
	#stream span:before {
		content:'';
		display:block;
		height:0;
		width:0;
		position:relative;
		top:-9px;
		border:5px solid #FFF;
		border-bottom-color:greenyellow;
	}
	#stream span {
		padding:0 10px 8px 10px;
		background-color:greenyellow;
		display:inline-block;
	}
	</style>
	<script type="text/javascript" src="http://lib.sinaapp.com/js/jquery/1.9.1/jquery-1.9.1.min.js"></script>
	<script type="text/javascript" src="function.js"></script>
	<script>
	$(function(){
		$('body').on('keyup', function(e){
			if(e.keyCode == 13) {
				var n = $('#text').val();
				if(n) {
					$.cookie('name', n, {expires: 7});
					$.cookie('time', '0', {expires: 7});
					window.location.href = 'index.html';
				}
			}
		});
	});
	</script>
</head>
<body>
	<div id="f">
		<input id="text" name="text" placeholder="输入ID并回车" autocomplete="off" value="" x-webkit-speech />
	</div>
</body>
</html>
