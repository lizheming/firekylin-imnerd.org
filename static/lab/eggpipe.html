<div id="pipe">
	<canvas id="outer"></canvas>
    <div id="half"></div>
</div>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
#pipe {
    width:100px;
    height:100px;
    margin:100px auto;
}
#outer {
    position:absolute;
    width:600px;
    height:300px;
    margin:-50px 0 0 -100px;
}
#half {
    position:absolute;
    width:100px;
    height:100px;
}
#pipe:before, #pipe:after, #half:before, #half:after {
    content:" ";
    width:50%;
    height:100%;
    display:block;
    background-color:#4b86db;
}
#pipe:before, #pipe:after {
    float:left;
}
#pipe:before, #half:after {
    background-color:#89abdd;
}
#pipe:before {
    border-top-left-radius:200px;
    border-bottom-left-radius:200px;
}
#pipe:after, #half:before, #half:after  {
    border-top-right-radius:200px;
    border-bottom-right-radius:200px;
}
#half:before, #half:after {
    position:absolute;
    margin-left:50%;
    transform-origin:left center;
    -webkit-transform-origin:left center;
}
#half:before {
    z-index:10;
    animation:hb-rotate 1s linear infinite;
    -webkit-animation:hb-rotate 1s linear infinite;
}
#half:after {
    z-index:15;
    animation:ha-rotate 1s linear infinite;
    -webkit-animation:ha-rotate 1s linear infinite;
}
@-webkit-keyframes ha-rotate {
    from {
        -webkit-transform:rotate(0deg);
        z-index:10;
    }
    25% {
        -webkit-transform:rotate(180deg);
        z-index:10;
    }
    50% {
        -webkit-transform:rotate(180deg);
        z-index:5;
    }
    75% {
    	-webkit-transform:rotate(360deg);
    	z-index:5;
    }
    to {
    	-webkit-transform:rotate(360deg);
    	z-index:10;
    }
}

@keyframes ha-rotate {
    from {
    	transform:rotate(0deg);
        -webkit-transform:rotate(0deg);
        z-index:10;
    }
    25% {
    	transform:rotate(180deg);
        -webkit-transform:rotate(180deg);
        z-index:10;
    }
    50% {
    	transform:rotate(180deg);
        -webkit-transform:rotate(180deg);
        z-index:5;
    }
    75% {
    	transform:rotate(360deg);
    	-webkit-transform:rotate(360deg);
    	z-index:5;
    }
    to {
    	transform:rotate(360deg);
    	-webkit-transform:rotate(360deg);
    	z-index:10;
    }
}
@-webkit-keyframes hb-rotate {
    from{
    	-webkit-transform:rotate(0deg);
    	z-index:5;
    }
    25% {
        -webkit-transform:rotate(0deg);
        z-index:10;
    }
    50% {
    	-webkit-transform:rotate(180deg);
    	z-index:10;
    }
    75% {
    	-webkit-transform:rotate(180deg);
    	z-index:5;
    }
    to {
        -webkit-transform:rotate(360deg);
        z-index:5;
    }
}
@keyframes hb-rotate {
    from{
    	transform:rotate(0deg);
    	-webkit-transform:rotate(0deg);
    	z-index:5;
    }
    25% {
    	transform:rotate(0deg);
        -webkit-transform:rotate(0deg);
        z-index:10;
    }
    50% {
    	transform:rotate(180deg);
    	-webkit-transform:rotate(180deg);
    	z-index:10;
    }
    75% {
    	transform:rotate(180deg);
    	-webkit-transform:rotate(180deg);
    	z-index:5;
    }
    to {
    	transform:rotate(360deg);
        -webkit-transform:rotate(360deg);
        z-index:5;
    }
}
</style>
<script>
var ctx = document.querySelector('canvas').getContext('2d');
var drawCircle = function (deg) {
    ctx.lineWidth = 3;
    
    for(var i = 1; i < 361; i++) {
        var red   = 95;
        var green = 180;
        var blue  = 125;
        var alpha = i / 360 ;
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(' + [red, green, blue, alpha].join(',') + ')';
        ctx.arc(50, 50, 30, (i - 1 + deg) * Math.PI / 180, (i + deg) * Math.PI / 180);
        ctx.stroke();
    }
};
var deg = 0, dis = 10;
var id = setInterval(function() {
    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
	deg += dis;
	if (deg > 360) deg = 0;
	drawCircle(deg);
}, 16);
</script>
