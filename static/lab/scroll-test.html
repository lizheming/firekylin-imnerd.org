.green {

  overflow-x: hidden;
  margin-top: 10px;

}
.scroll-x {
  height: 100%;
  left: 0;
  position: absolute;
}
.sky-blue, .yellow {
  height: 100%;
  display: inline-block;
}
.sky-blue:before,
.yellow:before {
  content: 'scroll block'attr(i);
}
.sky-blue {
  background: skyblue;
}

  (function() {
    var vWidth = window.screen.width;
    var singleWidth = 300 / 360 * vWidth;
    var scrolling, scrolled;

    $('.scroll-x > div').css('width', singleWidth+'px');
    $('.scroll-x').css('width', $('.scroll-x > div').length * (singleWidth+10) + 'px');

    var lastTouch = {x:0, y:0};
    $('.green').on('touchstart', function(e) {
      console.log('$gestureClose:0');
      scrolling = false;
      scrolled = false;

      var touches = e.changedTouches;
      lastTouch.x = touches[0].pageX;
      lastTouch.y = touches[0].pageY;
    }).on('touchmove', function(e) {
      var touches = e.changedTouches;
      var nowTouch = {x: touches[0].pageX, y: touches[0].pageY};
    
      if(!scrolled) {
        var delta = (nowTouch.x - lastTouch.x)*1;
        var lastLeft = parseInt($('.scroll-x').css('left'));
        if( !lastLeft ) { lastLeft = 0; }

        var deltaWidth = singleWidth + 10;
        var willLeft = delta>0 ? deltaWidth + lastLeft : lastLeft - deltaWidth;
        // willLeft = willLeft - willLeft%deltaWidth;

        var maxScrollWidth = $('.scroll-x').width() - vWidth;
        if(lastLeft === 0 && delta < 0) {
          willLeft += (vWidth - singleWidth)/2;
        }
        if(lastLeft <= -maxScrollWidth && delta > 0) {
          willLeft -= (vWidth - singleWidth)/2;
        }
        
        willLeft = Math.min(0, willLeft);
        willLeft = Math.max(willLeft, -maxScrollWidth);

        if(lastLeft !== willLeft) {
          $('.scroll-x').css('left', willLeft + 'px');
          scrolling = true;
          scrolled = true;
        }
      }

      lastTouch.x = nowTouch.x;
      lastTouch.y = nowTouch.y;

      /** 判断右滑是否到尽头 */
      // var isScrollXLeftEnd = $(this).scrollLeft() === 0;
      var isScrollXLeftEnd = parseInt($('.scroll-x').css('left')) === 0;
      if( isScrollXLeftEnd && !scrolling) {
        console.log('$gestureClose:1');
      }

    }).on('touchend', function() {
      console.log('$gestureClose:1');
    }).on('transitioned webkitTransitionEnd', () => {
      scrolling = false;
    });
